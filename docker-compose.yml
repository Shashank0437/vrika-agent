services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_TOOLS: ${INSTALL_TOOLS:-1}
    ports:
      - "${VRIKA_PORT:-8888}:8888"
    env_file:
      - .env
    volumes:
      - vrika_data:/app/.nyxstrike_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  vrika_data: