# Standalone agent (optional). Usually run via vrika-server/docker-compose.yml instead.
services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_TOOLS: ${AGENT_INSTALL_TOOLS:-0}
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      NYXSTRIKE_HOST: 0.0.0.0
      NYXSTRIKE_PORT: 8888
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
    volumes:
      - nyxstrike_data:/app/.nyxstrike_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  nyxstrike_data:
